<h2>{{ estudianteEditar ? 'Editar estudiante' : 'Agregar estudiante' }}</h2>

<form>
  <div>
    <label for="nombre">Nombre</label>
    <input
      id="nombre"
      type="text"
      [(ngModel)]="nombre"
      name="nombre">
  </div>

  <div>
    <label for="apellido">Apellido</label>
    <input
      id="apellido"
      type="text"
      [(ngModel)]="apellido"
      name="apellido">
  </div>

  <div>
    <label for="matricula">Matrícula</label>
    <input
      id="matricula"
      type="text"
      [(ngModel)]="matricula"
      name="matricula">
  </div>

  <div>
    <label for="carrera">Carrera</label>
    <input
      id="carrera"
      type="text"
      [(ngModel)]="carrera"
      name="carrera">
  </div>

  <div>
    <label for="semestre">Semestre</label>
    <input
      id="semestre"
      type="number"
      [(ngModel)]="semestre"
      name="semestre">
  </div>

  <div>
    <label for="correo">Correo</label>
    <input
      id="correo"
      type="email"
      [(ngModel)]="correo"
      name="correo">
  </div>

  <app-button
    [texto]="estudianteEditar ? 'Actualizar estudiante' : 'Guardar estudiante'"
    (presionado)="guardarEstudiante()">
  </app-button>
</form>
